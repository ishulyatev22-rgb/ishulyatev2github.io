<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b84ff" />
  <link rel="manifest" href="manifest.json" />
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js');
  }
</script>
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Учёт заданий</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --text-secondary: #4b5563;
      --border: #e5e7eb;
      --accent: #0b84ff;
      --accent-hover: #0066cc;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #1a1d24;
      --text: #eef2ff;
      --text-secondary: #9ca3af;
      --border: #2d313a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .theme-btn:hover {
      background: var(--border);
    }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    input, select, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11,132,255,0.2);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: #6b7280;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .flex-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: flex-end;
    }

    .filter-group {
      flex: 1;
      min-width: 160px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      background: var(--bg);
      padding: 16px;
      border-radius: 20px;
    }

    .stat-card {
      background: var(--surface);
      padding: 12px 20px;
      border-radius: 20px;
      flex: 1;
      min-width: 120px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card span {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }

    .breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .badge {
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 40px;
      border: 1px solid var(--border);
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-secondary);
      position: sticky;
      top: 0;
    }

    .date-cell {
      font-weight: 500;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit-btn, .delete-btn, .photo-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      border-radius: 40px;
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .edit-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .delete-btn:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .photo-btn:hover {
      background: #10b981;
      color: white;
      border-color: #10b981;
    }

    .notes-cell {
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
    }

    .photo-preview {
      max-width: 80px;
      max-height: 60px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid var(--border);
    }

    .photo-preview:hover {
      border-color: var(--accent);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
    }

    .modal-content {
      position: relative;
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90%;
      top: 50%;
      transform: translateY(-50%);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 680px) {
      body { padding: 12px; }
      .card { padding: 16px; }
      th, td { padding: 8px 6px; }
      .stat-card span { font-size: 1.4rem; }
      .photo-preview {
        max-width: 60px;
        max-height: 45px;
      }
    }

    @media print {
      .no-print,
      .theme-btn,
      .card h1,
      .card .form-grid,
      .card .flex-row,
      .card .filters-bar,
      .card .stats,
      .delete-btn,
      .edit-btn,
      .photo-btn,
      .actions {
        display: none !important;
      }

      body {
        padding: 8px;
        margin: 0;
        background: white;
        color: black;
      }

      .card {
        border: 1px solid #ccc;
        box-shadow: none;
        margin-bottom: 10px;
      }

      table {
        font-size: 10pt;
      }

      th, td {
        padding: 4px 6px;
        border-bottom: 1px solid #ccc;
      }

      .table-wrapper {
        overflow-x: visible;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Учёт заданий</h1>
      <button class="theme-btn" id="themeToggle">🌓 Тёмная тема</button>
    </div>

    <div class="card">
      <form id="taskForm">
        <div class="form-grid">
          <div>
            <label>📅 Дата</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label>🌙 Смена</label>
            <select id="shift">
              <option>День</option>
              <option>Ночь</option>
            </select>
          </div>
          <div>
            <label>⏱ Начало</label>
            <input type="time" id="startTime">
          </div>
          <div>
            <label>⏱ Конец</label>
            <input type="time" id="endTime">
          </div>
          <div>
            <label>📏 Длительность (мин)</label>
            <input id="duration" type="number" step="1" placeholder="авто">
          </div>
          <div>
            <label>🔧 Вид работ</label>
            <select id="workType" required>
              <option value="">Выберите...</option>
              <option>Тиснение</option>
              <option>Вырубка</option>
              <option>Резка</option>
              <option>Приладка тиража</option>
              <option>Тех. обслуживание</option>
              <option>Прочие работы</option>
            </select>
          </div>
          <div>
            <label>📦 Заказ (номер)</label>
            <input id="order" placeholder="№ заказа / клиент">
          </div>
          <div>
            <label>✅ Выполнено (шт/ед)</label>
            <input id="qtyDone" type="number" min="0" value="0" step="1">
          </div>
          <div class="full-width">
            <label>📝 Заметки / пояснение</label>
            <textarea id="notes" rows="2" placeholder="Доп. информация..."></textarea>
          </div>
          <div class="full-width">
            <label>📸 Фото задания</label>
            <input type="file" id="photoInput" accept="image/*">
            <div id="photoPreviewContainer" style="margin-top: 8px; display: none;">
              <img id="photoPreview" class="photo-preview" src="" alt="Предпросмотр">
              <button type="button" id="removePhotoBtn" class="btn-danger" style="margin-left: 8px; padding: 6px 12px;">🗑️ Удалить</button>
            </div>
            <input type="hidden" id="photoBase64">
          </div>
        </div>
        <div class="flex-row">
          <button type="submit">💾 Сохранить</button>
          <button type="button" id="clearBtn" class="btn-secondary">➕ Новая</button>
        </div>
        <input type="hidden" id="editId">
      </form>
    </div>

    <div class="card">
      <div class="filters-bar">
        <div class="filter-group">
          <label>Фильтр по дате</label>
          <input type="date" id="filterDate">
        </div>
        <div class="filter-group">
          <label>Вид работ</label>
          <select id="filterWorkType">
            <option value="">Все виды</option>
            <option>Тиснение</option>
            <option>Вырубка</option>
            <option>Резка</option>
            <option>Приладка тиража</option>
            <option>Тех. обслуживание</option>
            <option>Прочие работы</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Поиск по заказу</label>
          <input type="text" id="filterOrder" placeholder="Номер">
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="clearFilter" class="btn-secondary">Сброс</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">📋 Записей<br><span id="totalRecords">0</span></div>
        <div class="stat-card">✅ Выполнено<br><span id="totalQty">0</span></div>
        <div class="stat-card">⏱ Минут<br><span id="totalMinutes">0</span></div>
        <div class="stat-card">⚙️ По типам<br><div class="breakdown" id="typeBreakdown"></div></div>
      </div>

      <div class="table-wrapper">
        <table id="tasksTable">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Смена</th>
              <th>Вид</th>
              <th>Заказ</th>
              <th>Длит</th>
              <th>Время</th>
              <th>Кол-во</th>
              <th>Заметки</th>
              <th>Фото</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="listTbody"></tbody>
        </table>
      </div>

      <div class="flex-row">
        <button id="exportCsv" style="background: #10b981;">🟢 CSV</button>
        <button onclick="window.print()" class="no-print" style="background: #f59e0b;">🖨️ Печать</button>
      </div>
    </div>
  </div>

  <div id="photoModal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalPhoto">
  </div>

  <script>
    const STORAGE_KEY = "typo_tasks_pro";

    const taskForm = document.getElementById("taskForm");
    const editIdField = document.getElementById("editId");
    const dateInput = document.getElementById("date");
    const shiftSelect = document.getElementById("shift");
    const startTimeInput = document.getElementById("startTime");
    const endTimeInput = document.getElementById("endTime");
    const durationInput = document.getElementById("duration");
    const workTypeSelect = document.getElementById("workType");
    const orderInput = document.getElementById("order");
    const qtyDoneInput = document.getElementById("qtyDone");
    const notesInput = document.getElementById("notes");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const photoPreviewContainer = document.getElementById("photoPreviewContainer");
    const photoBase64Input = document.getElementById("photoBase64");
    const removePhotoBtn = document.getElementById("removePhotoBtn");
    const filterDate = document.getElementById("filterDate");
    const filterWorkType = document.getElementById("filterWorkType");
    const filterOrder = document.getElementById("filterOrder");
    const clearFilterBtn = document.getElementById("clearFilter");
    const totalRecordsSpan = document.getElementById("totalRecords");
    const totalQtySpan = document.getElementById("totalQty");
    const totalMinutesSpan = document.getElementById("totalMinutes");
    const typeBreakdownDiv = document.getElementById("typeBreakdown");
    const exportCsvBtn = document.getElementById("exportCsv");
    const themeToggle = document.getElementById("themeToggle");
    const photoModal = document.getElementById("photoModal");
    const modalPhoto = document.getElementById("modalPhoto");
    const modalClose = document.getElementsByClassName("modal-close")[0];

    function getTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try { return JSON.parse(raw); } catch(e) { return []; }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function generateId() {
      return 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    }

    // ========== ОБРАБОТКА ФОТО С СЖАТИЕМ ==========
    photoInput.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert("Фото слишком большое. Максимум 5MB");
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const maxWidth = 1280;
          const maxHeight = 1280;
          const quality = 0.7;
          
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);

          let base64 = canvas.toDataURL('image/jpeg', quality);
          const base64Size = (base64.length * 3 / 4) / (1024 * 1024);
          
          if (base64Size > 2 && quality > 0.5) {
            base64 = canvas.toDataURL('image/jpeg', quality - 0.15);
          }

          photoBase64Input.value = base64;
          photoPreview.src = base64;
          photoPreviewContainer.style.display = "block";
        };
        img.onerror = function() {
          alert("Ошибка при загрузке фото");
          photoInput.value = "";
        };
        img.src = event.target.result;
      };
      reader.onerror = function() {
        alert("Ошибка при чтении файла");
        photoInput.value = "";
      };
      reader.readAsDataURL(file);
    });

    removePhotoBtn.addEventListener("click", function() {
      photoInput.value = "";
      photoBase64Input.value = "";
      photoPreview.src = "";
      photoPreviewContainer.style.display = "none";
    });

    // ========== ТЕМА ==========
    const applyTheme = (theme) => {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️ Светлая" : "🌙 Тёмная";
    };

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      applyTheme(savedTheme);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      applyTheme("dark");
    } else {
      applyTheme("light");
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    // ========== ДЛИТЕЛЬНОСТЬ ==========
    function calcDurationAuto() {
      const start = startTimeInput.value;
      const end = endTimeInput.value;
      if (!start || !end) {
        durationInput.value = "";
        return;
      }
      const [h1, m1] = start.split(":").map(Number);
      const [h2, m2] = end.split(":").map(Number);
      if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) {
        durationInput.value = "";
        return;
      }
      let minutes = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (minutes < 0) minutes += 24 * 60;
      durationInput.value = minutes;
    }

    startTimeInput.addEventListener("input", calcDurationAuto);
    endTimeInput.addEventListener("input", calcDurationAuto);

    // ========== ОЧИСТКА ФОРМЫ ==========
    function resetForm() {
      taskForm.reset();
      editIdField.value = "";
      photoInput.value = "";
      photoBase64Input.value = "";
      photoPreview.src = "";
      photoPreviewContainer.style.display = "none";
      if (!dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
      }
      workTypeSelect.value = "";
      qtyDoneInput.value = "0";
      durationInput.value = "";
      notesInput.value = "";
      orderInput.value = "";
      startTimeInput.value = "";
      endTimeInput.value = "";
      shiftSelect.value = "День";
    }

    // ========== РЕДАКТИРОВАНИЕ ==========
    function fillFormForEdit(task) {
      dateInput.value = task.date || "";
      shiftSelect.value = task.shift || "День";
      startTimeInput.value = task.startTime || "";
      endTimeInput.value = task.endTime || "";
      durationInput.value = task.duration || "";
      workTypeSelect.value = task.workType || "";
      orderInput.value = task.order || "";
      notesInput.value = task.notes || "";
      qtyDoneInput.value = task.quantity || 0;
      editIdField.value = task.id;
      if (task.photo) {
        photoBase64Input.value = task.photo;
        photoPreview.src = task.photo;
        photoPreviewContainer.style.display = "block";
      } else {
        photoInput.value = "";
        photoBase64Input.value = "";
        photoPreview.src = "";
        photoPreviewContainer.style.display = "none";
      }
      calcDurationAuto();
    }

    // ========== СОХРАНЕНИЕ ==========
    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const workType = workTypeSelect.value;
      if (!workType) {
        alert("Выберите вид работ!");
        return;
      }
      const task = {
        id: editIdField.value || generateId(),
        date: dateInput.value,
        shift: shiftSelect.value,
        startTime: startTimeInput.value,
        endTime: endTimeInput.value,
        duration: parseInt(durationInput.value) || 0,
        workType: workType,
        order: orderInput.value.trim(),
        quantity: parseInt(qtyDoneInput.value) || 0,
        notes: notesInput.value.trim(),
        photo: photoBase64Input.value || null,
        createdAt: new Date().toISOString()
      };

      let tasks = getTasks();
      const idx = tasks.findIndex(t => t.id === task.id);
      if (idx !== -1) {
        task.createdAt = tasks[idx].createdAt || task.createdAt;
        tasks[idx] = task;
      } else {
        tasks.push(task);
      }
      saveTasks(tasks);
      resetForm();
      renderTableAndStats();
    });

    document.getElementById("clearBtn").addEventListener("click", resetForm);

    // ========== ФИЛЬТРЫ ==========
    function filterTasks(tasks) {
      return tasks.filter(task => {
        if (filterDate.value && task.date !== filterDate.value) return false;
        if (filterWorkType.value && task.workType !== filterWorkType.value) return false;
        if (filterOrder.value) {
          const orderText = task.order || "";
          if (!orderText.toLowerCase().includes(filterOrder.value.toLowerCase())) return false;
        }
        return true;
      });
    }

    function refreshWithFilters() {
      renderTableAndStats();
    }

    filterDate.addEventListener("input", refreshWithFilters);
    filterWorkType.addEventListener("change", refreshWithFilters);
    filterOrder.addEventListener("input", refreshWithFilters);
    clearFilterBtn.addEventListener("click", () => {
      filterDate.value = "";
      filterWorkType.value = "";
      filterOrder.value = "";
      refreshWithFilters();
    });

    // ========== ОТРИСОВКА ==========
    function renderTableAndStats() {
      let tasks = getTasks();
      const filtered = filterTasks(tasks);
      filtered.sort((a,b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

      const tbody = document.getElementById("listTbody");
      tbody.innerHTML = "";

      let totalQtySum = 0;
      let totalMinutesSum = 0;
      const typeMap = new Map();

      const months = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

      for (const task of filtered) {
        totalQtySum += task.quantity || 0;
        totalMinutesSum += task.duration || 0;
        const wt = task.workType;
        typeMap.set(wt, (typeMap.get(wt) || 0) + (task.quantity || 0));

        const row = tbody.insertRow();
        let dateStr = task.date || "";
        if (task.date) {
          const d = task.date.split('-');
          if (d.length === 3) {
            dateStr = `${d[2]} ${months[parseInt(d[1])-1]} ${d[0]}`;
          }
        }
        row.insertCell(0).innerHTML = `<span class="date-cell">${dateStr}</span>`;
        row.insertCell(1).textContent = task.shift || "";
        row.insertCell(2).textContent = task.workType || "";
        row.insertCell(3).textContent = task.order || "—";
        row.insertCell(4).textContent = task.duration || 0;
        const timeRange = (task.startTime || "") + (task.endTime ? ` – ${task.endTime}` : "");
        row.insertCell(5).textContent = timeRange || "—";
        row.insertCell(6).textContent = task.quantity || 0;
        row.insertCell(7).innerHTML = `<div class="notes-cell">${escapeHtml(task.notes || "")}</div>`;

        const photoCell = row.insertCell(8);
        if (task.photo) {
          const img = document.createElement("img");
          img.src = task.photo;
          img.className = "photo-preview";
          img.onclick = () => openModal(task.photo);
          photoCell.appendChild(img);
        } else {
          photoCell.textContent = "—";
        }

        const actionsCell = row.insertCell(9);
        actionsCell.className = "actions";
        const editBtn = document.createElement("button");
        editBtn.textContent = "✏️";
        editBtn.className = "edit-btn";
        editBtn.onclick = () => {
          const original = getTasks().find(t => t.id === task.id);
          if (original) fillFormForEdit(original);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑️";
        delBtn.className = "delete-btn";
        delBtn.onclick = () => {
          if (confirm("Удалить запись?")) {
            let all = getTasks();
            all = all.filter(t => t.id !== task.id);
            saveTasks(all);
            renderTableAndStats();
          }
        };
        actionsCell.appendChild(editBtn);
        actionsCell.appendChild(delBtn);
      }

      totalRecordsSpan.textContent = filtered.length;
      totalQtySpan.textContent = totalQtySum;
      totalMinutesSpan.textContent = totalMinutesSum;

      let breakdownHtml = "";
      Array.from(typeMap.keys()).sort().forEach(type => {
        breakdownHtml += `<span class="badge">${type}: ${typeMap.get(type)}</span>`;
      });
      typeBreakdownDiv.innerHTML = breakdownHtml || "<span class='badge'>нет данных</span>";
    }

    function openModal(src) {
      modalPhoto.src = src;
      photoModal.style.display = "block";
    }

    modalClose.onclick = () => photoModal.style.display = "none";
    window.onclick = (e) => { if (e.target == photoModal) photoModal.style.display = "none"; };

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    // ========== ЭКСПОРТ CSV ==========
    function escapeCsvCell(v) {
      if (v == null) return "";
      let s = String(v);
      if (s.includes(';') || s.includes('"') || s.includes('\n')) {
        s = s.replace(/"/g, '""');
        s = `"${s}"`;
      }
      return s;
    }

    exportCsvBtn.addEventListener("click", () => {
      const tasks = filterTasks(getTasks());
      if (tasks.length === 0) { alert("Нет данных"); return; }

      const headers = ["Дата","Смена","Вид работ","Заказ","Длительность","Начало","Конец","Кол-во","Заметки","Создано"];
      const rows = tasks.map(t => [
        t.date||"", t.shift||"", t.workType||"", t.order||"",
        t.duration||0, t.startTime||"", t.endTime||"",
        t.quantity||0, t.notes||"",
        t.createdAt ? new Date(t.createdAt).toLocaleString() : ""
      ].map(escapeCsvCell).join(";"));

      const csv = [headers.map(escapeCsvCell).join(";"), ...rows].join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "учёт_" + new Date().toISOString().split("T")[0] + ".csv";
      link.click();
    });

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    dateInput.value = new Date().toISOString().split('T')[0];
    renderTableAndStats();

    // ========== PWA ==========
    if ('serviceWorker' in navigator) {
      fetch('/service-worker.js', { method: 'HEAD' })
        .then(r => r.ok && navigator.serviceWorker.register('/service-worker.js'))
        .catch(() => {});
    }
  </script>
</body>
</html>
